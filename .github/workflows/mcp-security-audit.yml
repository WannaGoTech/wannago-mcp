name: WannaGo MCP v3.1 Security & Registry Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  audit-mcp-manifest-and-design:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify SPDX MIT License, server.json & SECURITY.md
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const srv = JSON.parse(fs.readFileSync("server.json", "utf8"));
            const plg = JSON.parse(fs.readFileSync("plugin.json", "utf8"));
            if (pkg.license !== "MIT" || srv.license !== "MIT" || plg.license !== "MIT") {
              throw new Error("SPDX MIT license mismatch");
            }
            if (!fs.existsSync("LICENSE") || !fs.existsSync("SECURITY.md")) {
              throw new Error("Missing LICENSE or SECURITY.md");
            }
            console.log("MCP Registry Manifest & Security Policy verified:", srv.name, srv.version);
          '

      - name: Run Deterministic Anti-AI & WCAG Static Audit (100/100)
        run: node engine/scanners/detect.mjs docs/index.html
